name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # One number for every build: the PC app, the installer and the phone app all show it.
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  recorder-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r pc/requirements.txt pytest httpx
      - run: python -m pytest -q pc/tests

  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # The phone app must be signed with the same key every time, or it can't update itself.
      # The key is the ANDROID_KEYSTORE_B64 secret (Settings > Secrets and variables > Actions).
      - name: Get the signing key
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/homecamera.jks"
            echo "HOMECAMERA_KEYSTORE=$RUNNER_TEMP/homecamera.jks" >> "$GITHUB_ENV"
            echo "HOMECAMERA_KEYSTORE_PASSWORD=homecamera" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret, so the phone app is signed with a throwaway key and can't update itself."
          fi
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PappVersionCode=${{ github.run_number }} -PappVersionName=$APP_VERSION
      # Published as a release download rather than a build artifact, so it doesn't use
      # the account's artifact storage and the link stays the same.
      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk HomeCamera.apk
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Home Camera (latest build)" \
              --notes "Android app built from the newest code. Download HomeCamera.apk onto your phone and open it."
          gh release upload latest HomeCamera.apk --clobber
          # Tells the PC there's a new phone app (only for builds signed with the lasting key,
          # since others can't install over the phone's copy).
          if [ -n "$HOMECAMERA_KEYSTORE" ]; then
            printf '{"version": "%s", "code": %s, "sha256": "%s", "size": %s}' "$APP_VERSION" "${{ github.run_number }}" \
              "$(sha256sum HomeCamera.apk | cut -d' ' -f1)" "$(stat -c%s HomeCamera.apk)" > android.json
            gh release upload latest android.json --clobber
          fi
          gh release edit latest --title "Home Camera $APP_VERSION" --notes "$(printf 'Newest version: **%s**, built %s.\n\n- **HomeCameraSetup.exe**: run on the Windows PC. Installing over an older version keeps your settings and recordings.\n- **HomeCamera.apk**: open on your Android phone.\n\nThe version in use is shown in Home Camera under Settings > About.' "$APP_VERSION" "$(date -u '+%d %b %Y %H:%M UTC')")"

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt pyinstaller

      - name: Download the person detection model
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          $base = "https://raw.githubusercontent.com/chuanqi305/MobileNet-SSD/master"
          Invoke-WebRequest "$base/deploy.prototxt" -OutFile models/deploy.prototxt
          Invoke-WebRequest "$base/mobilenet_iter_73000.caffemodel" -OutFile models/mobilenet_iter_73000.caffemodel

      - name: Download the face recognition models
        run: |
          $zoo = "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models"
          Invoke-WebRequest "$zoo/face_detection_yunet/face_detection_yunet_2023mar.onnx" -OutFile models/face_detection_yunet_2023mar.onnx
          Invoke-WebRequest "$zoo/face_recognition_sface/face_recognition_sface_2021dec.onnx" -OutFile models/face_recognition_sface_2021dec.onnx
          # Knowing people from behind (build, height, clothes): the block-quantised YoutuReID model.
          # The plain int8 file is smaller but far less accurate in OpenCV, so don't swap it in.
          Invoke-WebRequest "$zoo/person_reid_youtureid/person_reid_youtu_2021nov_int8bq.onnx" -OutFile models/person_reid_youtu_2021nov_int8bq.onnx
          Get-ChildItem models

      - name: Stamp the version
        run: |
          $built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $commit = "${{ github.sha }}".Substring(0, 7)
          "VERSION = `"$env:APP_VERSION`"`nCOMMIT = `"$commit`"`nBUILT = `"$built`"" | Set-Content camhub/_build.py
          Get-Content camhub/_build.py

      - name: Package camhub.exe
        run: pyinstaller --noconfirm installer/camhub.spec

      - name: Download FFmpeg
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-unzipped
          New-Item -ItemType Directory -Force installer/ffmpeg | Out-Null
          Get-ChildItem ffmpeg-unzipped -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination installer/ffmpeg
          Get-ChildItem installer/ffmpeg

      - name: Check camhub.exe runs
        run: |
          $v = (dist/camhub/camhub.exe --version | Out-String).Trim()
          if ($v -ne "Home Camera $env:APP_VERSION") { throw "camhub.exe says '$v', expected $env:APP_VERSION" }
          '{"password": "ci-password-123", "storage": "C:/ci-recordings"}' | Set-Content answers.json
          dist/camhub/camhub.exe --config "$PWD/ci/config.json" setup --answers answers.json
          if ($LASTEXITCODE -ne 0) { throw "setup failed: $LASTEXITCODE" }
          $p = Start-Process dist/camhub/camhub.exe -ArgumentList "--config `"$PWD/ci/config.json`" run" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { if ((Invoke-WebRequest http://localhost:8080/login -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process $p -Force
          Get-Content ci/logs/camhub.log -ErrorAction SilentlyContinue
          if (-not $ok) { throw "camhub.exe did not serve the viewer" }

      - name: Check camhub.exe shows a camera from RTSP
        run: |
          # A stand-in camera: mediamtx serves a test video over RTSP, like the real camera.
          Invoke-WebRequest "https://github.com/bluenviron/mediamtx/releases/download/v1.9.3/mediamtx_v1.9.3_windows_amd64.zip" -OutFile mediamtx.zip
          Expand-Archive mediamtx.zip -DestinationPath mediamtx
          $ff = "$PWD/installer/ffmpeg/ffmpeg.exe"
          & $ff -v error -f lavfi -i "testsrc=size=1920x1080:rate=15" -f lavfi -i "sine=frequency=440:sample_rate=8000" -t 20 -c:v libx264 -g 30 -c:a pcm_alaw main.mkv
          & $ff -v error -f lavfi -i "testsrc=size=640x360:rate=15" -t 20 -c:v libx264 -g 30 sub.mkv
          $env:MTX_RTSPADDRESS = ":554"
          $mtx = Start-Process mediamtx/mediamtx.exe -WorkingDirectory "$PWD/mediamtx" -PassThru
          Start-Sleep 3
          $pubs = @(
            (Start-Process $ff -ArgumentList "-v error -re -stream_loop -1 -i main.mkv -c copy -f rtsp rtsp://127.0.0.1:554/live/main" -PassThru -NoNewWindow),
            (Start-Process $ff -ArgumentList "-v error -re -stream_loop -1 -i sub.mkv -c copy -f rtsp rtsp://127.0.0.1:554/live/sub" -PassThru -NoNewWindow))
          Copy-Item installer/ffmpeg/*.exe dist/camhub/
          $p = Start-Process dist/camhub/camhub.exe -ArgumentList "--config `"$PWD/ci/config.json`" run" -PassThru
          $online = $false
          try {
            Start-Sleep 5
            $tok = (Invoke-RestMethod http://localhost:8080/api/login -Method Post -ContentType application/json -Body '{"password": "ci-password-123"}').token
            $h = @{ Authorization = "Bearer $tok" }
            $setup = Invoke-RestMethod http://localhost:8080/api/cameras/setup -Method Post -Headers $h -ContentType application/json -TimeoutSec 300 `
              -Body '{"name": "Garden", "ip": "127.0.0.1", "user": "", "password": "", "onvif_port": 0}'
            $setup.log
            foreach ($i in 1..45) {
              Start-Sleep 2
              $cam = (Invoke-RestMethod http://localhost:8080/api/status -Headers $h).cameras[0]
              if ($cam.online) { $online = $true; break }
            }
            $cam | ConvertTo-Json
            if ($online) {
              $snap = Invoke-WebRequest "http://localhost:8080/api/cameras/$($cam.id)/snapshot.jpg" -Headers $h -UseBasicParsing
              "Snapshot: $($snap.RawContentLength) bytes"
              # The face recognition models made it into camhub.exe and load.
              $smart = Invoke-RestMethod http://localhost:8080/api/smart -Headers $h
              "Face recognition ready: $($smart.faces_available)"
              if (-not $smart.faces_available) { throw "face recognition models did not load in camhub.exe" }
              "Body recognition ready: $($smart.bodies_available)"
              if (-not $smart.bodies_available) { throw "body recognition model did not load in camhub.exe" }
            }
          } finally {
            Stop-Process $p -Force
            $pubs | ForEach-Object { Stop-Process $_ -Force -ErrorAction SilentlyContinue }
            Stop-Process $mtx -Force
            Get-Content ci/logs/camhub.log -ErrorAction SilentlyContinue
            # camhub's own ffmpeg children outlive it when it is killed, so stop them before cleaning up.
            Get-Process ffmpeg, ffprobe -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            Remove-Item dist/camhub/ffmpeg.exe, dist/camhub/ffprobe.exe
          }
          if (-not $online) { throw "the camera never came online in camhub.exe" }

      - name: Build the installer
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:APP_VERSION" installer/HomeCamera.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem installer/output

      - name: Test install, run and uninstall
        run: |
          $setup = (Resolve-Path installer/output/HomeCameraSetup.exe).Path
          # WaitForExit waits for setup itself only (Start-Process -Wait would also wait for
          # anything setup started).
          $p = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=`"$PWD\install.log`" /VIEWERPASSWORD=ci-password-123" -PassThru
          if (-not $p.WaitForExit(600000)) { Get-Content install.log; throw "install did not finish in 10 minutes" }
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "install failed: $($p.ExitCode)" }
          Get-Content install.log | Select-Object -Last 15
          Get-ScheduledTask -TaskName "Home Camera" | Format-List TaskName, State
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { if ((Invoke-WebRequest http://localhost:8080/login -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          $r = Invoke-WebRequest http://localhost:8080/api/login -Method Post -ContentType "application/json" -Body '{"password":"ci-password-123"}' -UseBasicParsing -SkipHttpErrorCheck
          Write-Host "Sign in returned $($r.StatusCode)"
          Get-Content "$env:ProgramData\HomeCamera\logs\camhub.log" -ErrorAction SilentlyContinue
          if (-not $ok -or $r.StatusCode -ne 200) { throw "installed Home Camera is not working" }

          # Automatic update: the same way camhub.exe starts an installer it downloaded
          # (a one-off task, so it survives camhub.exe being stopped), install over the top.
          python -c "import sys; sys.path.insert(0, '.'); from camhub.updater import launch_installer; launch_installer(sys.argv[1], sys.argv[2])" $setup "$PWD\update.log"
          if ($LASTEXITCODE -ne 0) { throw "couldn't start the update" }
          Start-Sleep 10
          foreach ($i in 1..90) {
            if ((Get-ScheduledTask -TaskName "Home Camera Update").State -ne "Running") { break }
            Start-Sleep 5
          }
          Get-Content update.log -ErrorAction SilentlyContinue | Select-Object -Last 10
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { if ((Invoke-WebRequest http://localhost:8080/login -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          $r = Invoke-WebRequest http://localhost:8080/api/login -Method Post -ContentType "application/json" -Body '{"password":"ci-password-123"}' -UseBasicParsing -SkipHttpErrorCheck
          if (-not $ok -or $r.StatusCode -ne 200) { throw "Home Camera didn't come back after the automatic update (sign in $($r.StatusCode))" }
          Write-Host "Automatic update installed and Home Camera came back with the same password."
          schtasks /Delete /F /TN "Home Camera Update" | Out-Null
          $u = Start-Process "${env:ProgramFiles}\Home Camera\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru
          if (-not $u.WaitForExit(300000)) { throw "uninstall did not finish in 5 minutes" }
          # The uninstaller hands over to a copy of itself, so wait for the files to go.
          foreach ($i in 1..60) { if (-not (Test-Path "${env:ProgramFiles}\Home Camera\camhub.exe")) { break }; Start-Sleep 2 }
          if (Get-ScheduledTask -TaskName "Home Camera" -ErrorAction SilentlyContinue) { throw "uninstall left the task behind" }
          if (Test-Path "${env:ProgramFiles}\Home Camera\camhub.exe") { throw "uninstall left files behind" }
          Write-Host "Install, run and uninstall all worked."

      - name: Upload installer
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: HomeCameraSetup
          path: pc/installer/output/HomeCameraSetup.exe

      - name: Publish installer to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create latest --title "Home Camera (latest build)" --notes "Newest build." }
          gh release upload latest installer/output/HomeCameraSetup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload failed" }
          # Read by Home Camera's automatic updates: the newest version and the installer's checksum.
          $exe = Get-Item installer/output/HomeCameraSetup.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "{`"version`": `"$env:APP_VERSION`", `"sha256`": `"$hash`", `"size`": $($exe.Length)}" | Set-Content -NoNewline windows.json
          gh release upload latest windows.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "upload of windows.json failed" }
          $built = (Get-Date).ToUniversalTime().ToString("dd MMM yyyy HH:mm 'UTC'")
          $notes = "Newest version: **$env:APP_VERSION**, built $built.`n`n- **HomeCameraSetup.exe**: run on the Windows PC. Installing over an older version keeps your settings and recordings.`n- **HomeCamera.apk**: open on your Android phone.`n`nThe version in use is shown in Home Camera under Settings > About."
          gh release edit latest --title "Home Camera $env:APP_VERSION" --notes $notes
