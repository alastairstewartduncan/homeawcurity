<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1020">
<title>A.S.D Home Security</title>
<link rel="icon" href="/favicon.svg">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .login { width: 100%; max-width: 380px; padding: 32px 28px 24px; text-align: center; }
  .login .logo { width: 72px; height: 72px; display: block; margin: 0 auto 14px;
    filter: drop-shadow(0 10px 24px rgba(59,130,246,.45)); }
  .login h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: .05em; line-height: 1.1; }
  .login .tag { font-size: 11px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 18px; }
  .login input { width: 100%; padding: 13px 14px; margin: 18px 0 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel-2); }
  .login button { width: 100%; padding: 13px; border-radius: 12px; font-size: 16px; }
  .error { color: var(--rec); min-height: 22px; margin-top: 10px; }
  #server { font-size: 13px; }
</style>
</head>
<body>
<form class="card login" id="f">
  <img class="logo" src="/favicon.svg" alt="">
  <h1>A.S.D</h1>
  <div class="tag">Home Security</div>
  <div class="muted">Enter your password to see your cameras.</div>
  <input type="password" id="p" autocomplete="current-password" placeholder="Password" autofocus required>
  <button class="primary" type="submit">Sign in</button>
  <div class="error" id="e"></div>
  <a href="#" id="server" class="muted hidden">Change PC address</a>
</form>
<script>
if (window.HomeCamera && window.HomeCamera.changeServer) {
  const a = document.getElementById('server');
  a.classList.remove('hidden');
  a.addEventListener('click', (ev) => { ev.preventDefault(); window.HomeCamera.changeServer(); });
}
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const e = document.getElementById('e');
  e.textContent = '';
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: document.getElementById('p').value})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { e.textContent = j.error || 'Sign in failed'; return; }
  // Inside the Android app, hand the token over so it can send notifications.
  if (window.HomeCamera && window.HomeCamera.setToken) window.HomeCamera.setToken(j.token);
  // Only the TV page is allowed as somewhere to go back to.
  location.href = new URLSearchParams(location.search).get('next') === '/tv' ? '/tv' : '/';
});
</script>
</body>
</html>
