<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.S.D Home Security</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/timeline.css">
<link rel="stylesheet" href="/static/grid.css">
<link rel="stylesheet" href="/static/smart.css">
<script src="/static/timeline.js" defer></script>
<script src="/static/privacy.js" defer></script>
</head>
<body>
<header>
  <h1><img src="/favicon.svg" width="22" height="22" alt=""> A.S.D Home Security</h1>
  <nav>
    <button data-tab="live" class="active">Live</button>
    <button data-tab="recordings">Recordings</button>
    <button data-tab="smart">Smart</button>
    <button data-tab="ai">AI</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <div class="header-right">
    <button id="presence-pill" class="presence hidden" title="Home and away"></button>
    <span class="storage" id="storage"></span>
    <span class="storage version" id="version" title="A.S.D Home Security version. More in Settings > About."></span>
    <button id="logout">Sign out</button>
  </div>
</header>

<main>
  <section id="tab-live">
    <div class="health-banner hidden" id="health-banner"></div>
    <div class="grid-live" id="live"></div>
  </section>

  <section id="tab-recordings" class="hidden">
    <div id="ask"></div>
    <div class="toolbar">
      <div class="days" id="days"></div>
      <div class="seg" id="filter">
        <button data-f="all" class="active">All</button>
        <button data-f="person">People</button>
      </div>
      <select id="cam-filter"></select>
    </div>
    <div class="clips" id="clips"></div>
  </section>

  <section id="tab-smart" class="hidden">
    <div class="settings" id="smart"></div>
  </section>

  <section id="tab-ai" class="hidden">
    <div class="settings" id="ai"></div>
  </section>

  <section id="tab-settings" class="hidden">
    <div class="settings" id="settings"></div>
  </section>
</main>

<div class="player hidden" id="player">
  <video id="video" controls playsinline preload="auto"></video>
  <div class="player-bar">
    <div class="title" id="player-title"></div>
    <button id="describe" class="hidden">Describe with AI</button>
    <button id="prev">◀ Newer</button>
    <button id="next">Older ▶</button>
    <a id="download"><button>Download</button></a>
    <button id="delete" class="danger">Delete</button>
    <button id="close" class="primary">Close</button>
  </div>
</div>

<template id="cam-tpl">
  <div class="cam">
    <div class="cam-head"><span class="name"></span><span class="pill state"></span></div>
    <div class="video-wrap"><img alt="Live view"><div class="msg hidden">Connecting…</div><div class="why hidden"></div></div>
    <div class="cam-tools">
      <div class="ptz hidden" title="Hold an arrow to turn the camera">
        <span class="c"></span><button data-d="0,1" aria-label="Up">▲</button><span class="c"></span>
        <button data-d="-1,0" aria-label="Left">◀</button><button class="home" aria-label="Home position" title="Go to the home position">⌂</button><button data-d="1,0" aria-label="Right">▶</button>
        <span class="c"></span><button data-d="0,-1" aria-label="Down">▼</button><span class="c"></span>
      </div>
      <div class="tool-col">
        <div class="zoom" title="Zoom. You can also scroll the mouse wheel or pinch the picture.">
          <button class="zoom-out" aria-label="Zoom out">−</button>
          <span class="zoom-level">1×</span>
          <button class="zoom-in" aria-label="Zoom in">+</button>
        </div>
        <div class="zoom lens hidden" title="The camera's own zoom lens. Hold a button down.">
          <button class="lens-out" aria-label="Lens zoom out">−</button>
          <span class="zoom-level">Lens</span>
          <button class="lens-in" aria-label="Lens zoom in">+</button>
        </div>
        <div class="speed ptz-speed hidden">Turn speed<input type="range" min="0.1" max="1" step="0.1" value="0.5"></div>
      </div>
      <div class="tool-col">
        <button class="listen" aria-pressed="false">🔈 Listen</button>
        <button class="talk hidden" title="Hold to talk through the camera's speaker">🎤 Hold to talk</button>
      </div>
      <div style="flex:1"></div>
      <button class="snap">Save picture</button>
      <button class="full">Full screen</button>
    </div>
    <div class="positions hidden">
      <div class="pos-row">
        <span class="pos-label">Positions</span>
        <span class="chips"></span>
        <button class="add-pos" title="Remember where the camera is pointing now">＋ Save position</button>
        <span class="add-form hidden">
          <input class="pos-name" placeholder="Name, e.g. Gate" maxlength="30">
          <button class="primary save-pos">Save</button><button class="cancel-pos">Cancel</button>
        </span>
        <button class="edit-pos hidden">Edit</button>
      </div>
      <div class="pos-row">
        <label class="check" title="Turn between the saved positions. Pauses while recording and for 2 minutes after you steer by hand.">
          <input type="checkbox" class="patrol"> Patrol between positions, every
          <select class="patrol-secs">
            <option value="15">15 s</option><option value="30">30 s</option><option value="60">1 min</option>
            <option value="300">5 min</option><option value="900">15 min</option>
          </select>
        </label>
        <label class="check" title="When something moves near the edge of the picture, turn a little towards it.">
          <input type="checkbox" class="follow"> Turn towards movement
        </label>
      </div>
    </div>
  </div>
</template>

<script src="/static/app.js"></script>
<script src="/static/alerts.js"></script>
<script src="/static/homelinks.js"></script>
<script src="/static/backup.js"></script>
<script src="/static/remote.js"></script>
<script src="/static/updates.js"></script>
<script src="/static/ai.js"></script>
<script src="/static/summaries.js"></script>
<script src="/static/grid.js"></script>
<script src="/static/smart.js"></script>
</body>
</html>
